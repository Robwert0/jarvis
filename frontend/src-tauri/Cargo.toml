[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis desktop assistant"
authors = ["Robert"]
edition = "2021"

# The library is what Tauri's mobile entry point and the binary both call into.
[lib]
name = "jarvis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by tauri-cli for production builds.
custom-protocol = ["tauri/custom-protocol"]
